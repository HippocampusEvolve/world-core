<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Procedural Cabin Fireplace — Three.js</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#07070a;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e8dcc8}
  canvas{display:block;width:100%;height:100%}

  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse 78% 68% at 52% 52%,rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 100%)}
  #grain{position:fixed;inset:-50%;pointer-events:none;z-index:4;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:g 1.1s steps(3) infinite}
  @keyframes g{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:6}
  #keys{position:absolute;left:14px;top:14px;font-size:11px;line-height:1.75;
    background:rgba(14,10,8,.55);border:1px solid rgba(232,220,200,.13);
    border-radius:6px;padding:9px 12px;pointer-events:auto;max-width:260px}
  #keys kbd{background:rgba(232,220,200,.16);border-radius:3px;padding:1px 5px;font-size:10px}
  #keys .t{opacity:.5;letter-spacing:.16em;font-size:10px;margin-bottom:4px}

  #mats{position:absolute;right:0;top:0;height:100%;width:250px;overflow-y:auto;
    background:rgba(10,8,7,.9);border-left:1px solid rgba(232,220,200,.12);
    padding:12px 12px 40px;pointer-events:auto;transform:translateX(100%);
    transition:transform .25s ease;backdrop-filter:blur(6px)}
  #mats.on{transform:none}
  #mats h2{font-size:10px;letter-spacing:.2em;opacity:.5;margin:0 0 10px;font-weight:500}
  .m{margin-bottom:12px}
  .m .n{font-size:11px;opacity:.85;margin-bottom:4px}
  .m .r{display:flex;gap:4px}
  .m canvas{width:68px;height:68px;border-radius:3px;border:1px solid rgba(232,220,200,.14)}
  .m .lbl{font-size:9px;opacity:.35;text-align:center;width:68px;margin-top:2px}

  #load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#07070a}
  #load .ttl{font-size:11px;letter-spacing:.3em;opacity:.5}
  #load .bar{width:min(320px,70vw);height:2px;background:rgba(232,220,200,.14)}
  #load .bar i{display:block;height:100%;width:0;background:#e8935a;transition:width .18s}
  #load .st{font-size:11px;opacity:.4;height:14px}
  #load.done{opacity:0;pointer-events:none;transition:opacity .7s}

  #stick{position:absolute;width:96px;height:96px;border:1px solid rgba(232,220,200,.2);
    border-radius:50%;display:none}
  #stick i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
    border-radius:50%;background:rgba(232,220,200,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="grain"></div>

<div id="ui">
  <div id="keys">
    <div class="t">ХИЖИНА · ПРОЦЕДУРНЫЕ МАТЕРИАЛЫ</div>
    <div><kbd>WASD</kbd> ходьба · <kbd>Shift</kbd> быстрее</div>
    <div><kbd>мышь</kbd> обзор (клик по сцене)</div>
    <div><kbd>M</kbd> карты материалов · <kbd>F</kbd> полёт</div>
    <div><kbd>1</kbd>/<kbd>2</kbd> огонь · <kbd>[</kbd>/<kbd>]</kbd> экспозиция</div>
    <div><kbd>H</kbd> скрыть интерфейс</div>
  </div>
  <div id="stick"><i></i></div>
  <div id="mats"><h2>ПРОЦЕДУРНЫЕ КАРТЫ</h2><div id="matlist"></div></div>
</div>

<div id="load">
  <div class="ttl">РАЗЖИГАЕМ</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="st" id="st">…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   ЗИМНЯЯ ХИЖИНА — всё, кроме three.js, считается здесь:
   бревенчатые стены, бутовый камень (Worley), огнеупорный кирпич, половая
   доска, торцы дров, тёсаный брус мантии, ткань, ночное окно, чугун и
   покадрово генерируемое пламя.
   ========================================================================= */

/* ----------------------------- шум ----------------------------- */
function hash2(x, y, s){
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h ^= h >>> 15; h = Math.imul(h, 0x2545f491); h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2d); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function wrapi(a, n){ a %= n; return a < 0 ? a + n : a; }
function vnoise(x, y, px, py, s){
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const x0 = wrapi(xi, px), x1 = wrapi(xi + 1, px);
  const y0 = wrapi(yi, py), y1 = wrapi(yi + 1, py);
  const a = hash2(x0, y0, s), b = hash2(x1, y0, s);
  const c = hash2(x0, y1, s), d = hash2(x1, y1, s);
  const t = a + (b - a) * u, q = c + (d - c) * u;
  return t + (q - t) * v;
}
function fbm(x, y, px, py, oct, s, gain){
  gain = gain === undefined ? 0.5 : gain;
  let amp = 1, f = 1, sum = 0, nrm = 0;
  for (let i = 0; i < oct; i++){
    sum += amp * vnoise(x * f, y * f, px * f, py * f, s + i * 7919);
    nrm += amp; amp *= gain; f *= 2;
  }
  return sum / nrm;
}
function ridge(x, y, px, py, oct, s){ return 1 - Math.abs(2 * fbm(x, y, px, py, oct, s) - 1); }

/* клеточный шум — из него растёт бутовая кладка камина */
const _w = { f1: 0, f2: 0, id: 0 };
function worley(x, y, px, py, seed){
  const xi = Math.floor(x), yi = Math.floor(y);
  let f1 = 9, f2 = 9, id = 0;
  for (let j = -1; j <= 1; j++){
    for (let i = -1; i <= 1; i++){
      const cx = xi + i, cy = yi + j;
      const wx = wrapi(cx, px), wy = wrapi(cy, py);
      const dx = cx + 0.12 + hash2(wx, wy, seed) * 0.76 - x;
      const dy = cy + 0.12 + hash2(wx, wy, seed + 13) * 0.76 - y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < f1){ f2 = f1; f1 = d; id = hash2(wx, wy, seed + 29); }
      else if (d < f2) f2 = d;
    }
  }
  _w.f1 = f1; _w.f2 = f2; _w.id = id;
  return _w;
}

/* --------------------------- цвет --------------------------- */
const cl = (v, a, b) => v < a ? a : (v > b ? b : v);
const cl01 = v => v < 0 ? 0 : (v > 1 ? 1 : v);
function ss(e0, e1, x){ const t = cl01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); }
function mix(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function add(c, k){ return [c[0] + k, c[1] + k, c[2] + k]; }

/* ------------------------ сборка карт ------------------------ */
const SETS = {};
function cv(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function makeSet(name, size, fn, nstr){
  const map = cv(size, size), mctx = map.getContext('2d');
  const img = mctx.createImageData(size, size);
  const H = new Float32Array(size * size), R = new Float32Array(size * size), M = new Float32Array(size * size);
  let hasM = false, i = 0;
  const p = { r: 0, g: 0, b: 0, h: 0.5, rough: 0.85, metal: -1 };
  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++, i++){
      p.h = 0.5; p.rough = 0.85; p.metal = -1;
      fn(x, y, size, p);
      const o = i * 4;
      img.data[o] = cl(p.r, 0, 255); img.data[o+1] = cl(p.g, 0, 255);
      img.data[o+2] = cl(p.b, 0, 255); img.data[o+3] = 255;
      H[i] = p.h; R[i] = cl01(p.rough);
      if (p.metal >= 0){ M[i] = cl01(p.metal); hasM = true; }
    }
  }
  mctx.putImageData(img, 0, 0);
  const set = {
    map: tex(map, true),
    normalMap: tex(normalFromHeight(H, size, nstr === undefined ? 2.2 : nstr), false),
    roughnessMap: tex(grayCanvas(R, size), false),
    previews: []
  };
  if (hasM) set.metalnessMap = tex(grayCanvas(M, size), false);
  set.previews = [['albedo', map], ['normal', set.normalMap.image], ['rough', set.roughnessMap.image]];
  SETS[name] = set;
  return set;
}
function normalFromHeight(H, S, strength){
  const c = cv(S, S), ctx = c.getContext('2d'), img = ctx.createImageData(S, S);
  const at = (x, y) => H[wrapi(y, S) * S + wrapi(x, S)];
  let i = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++, i++){
    const dx = (at(x + 1, y) - at(x - 1, y)) * strength * S / 128;
    const dy = (at(x, y + 1) - at(x, y - 1)) * strength * S / 128;
    const l = Math.sqrt(dx * dx + dy * dy + 1), o = i * 4;
    img.data[o] = (-dx / l * 0.5 + 0.5) * 255;
    img.data[o+1] = (dy / l * 0.5 + 0.5) * 255;
    img.data[o+2] = (1 / l * 0.5 + 0.5) * 255;
    img.data[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0); return c;
}
function grayCanvas(A, S){
  const c = cv(S, S), ctx = c.getContext('2d'), img = ctx.createImageData(S, S);
  for (let i = 0; i < S * S; i++){ const v = A[i] * 255, o = i * 4;
    img.data[o] = img.data[o+1] = img.data[o+2] = v; img.data[o+3] = 255; }
  ctx.putImageData(img, 0, 0); return c;
}
function tex(canvas, srgb){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
function cloneTex(t, rx, ry){
  const c = t.clone(); c.needsUpdate = true;
  c.wrapS = c.wrapT = THREE.RepeatWrapping; c.repeat.set(rx, ry); c.anisotropy = 8;
  return c;
}
function matOf(set, o){
  o = o || {};
  const rx = o.repeat ? o.repeat[0] : 1, ry = o.repeat ? o.repeat[1] : 1;
  const ns = o.normalScale === undefined ? 1 : o.normalScale;
  const m = new THREE.MeshStandardMaterial({
    map: cloneTex(set.map, rx, ry),
    normalMap: cloneTex(set.normalMap, rx, ry),
    roughnessMap: cloneTex(set.roughnessMap, rx, ry),
    normalScale: new THREE.Vector2(ns, ns),
    color: o.color === undefined ? 0xffffff : o.color,
    roughness: o.roughness === undefined ? 1 : o.roughness,
    metalness: o.metalness === undefined ? 0 : o.metalness
  });
  if (set.metalnessMap){
    m.metalnessMap = cloneTex(set.metalnessMap, rx, ry);
    if (o.metalness === undefined) m.metalness = 1;
  }
  if (o.emissive !== undefined){ m.emissive = new THREE.Color(o.emissive); m.emissiveIntensity = o.ei || 1; }
  m.envMapIntensity = 0;
  return m;
}

/* ========================== ГЕНЕРАТОРЫ ========================== */

/* 1. Бревно сруба — продольная свиль, трещины усушки, потемневшее дерево */
function genLog(x, y, S, p){
  const u = x / S, v = y / S;                      /* v — вдоль бревна */
  const swirl = fbm(u * 5, v * 1.4, 5, 1, 3, 71);
  const grain = Math.abs(Math.sin((u * 3.4 + swirl * 2.6) * Math.PI * 2));
  const fine = fbm(u * 26, v * 4, 26, 4, 4, 131);
  let c = mix([38, 28, 20], [96, 70, 46], cl01(grain * 0.5 + fine * 0.5));
  /* трещины усушки вдоль волокна */
  const crack = ss(0.955, 1, ridge(u * 22, v * 2.4, 22, 2, 3, 191));
  c = mix(c, [16, 11, 8], crack * 0.9);
  /* сучки */
  const w = worley(u * 4, v * 2.6, 4, 3, 233);
  const knot = ss(0.22, 0.04, w.f1) * ss(0.72, 0.95, w.id);
  c = mix(c, [30, 20, 13], knot * 0.85);
  /* копоть сверху, светлее снизу — как будто свет очага снизу */
  c = add(c, (fine - 0.5) * 16);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = 0.5 + (grain - 0.5) * 0.25 + (fine - 0.5) * 0.35 - crack * 0.55 - knot * 0.2;
  p.rough = 0.86 + (fine - 0.5) * 0.1 - knot * 0.12;
}

/* 2. Бутовый камень камина — Worley с искажением домена */
function genRubble(warm){
  const A = warm ? [72, 68, 62] : [56, 57, 55];
  const B = warm ? [140, 134, 122] : [116, 118, 114];
  return function(x, y, S, p){
    const u = x / S, v = y / S;
    const wx = fbm(u * 6, v * 6, 6, 6, 3, 311) - 0.5;
    const wy = fbm(u * 6, v * 6, 6, 6, 3, 317) - 0.5;
    /* камни вытянуты по горизонтали */
    const w = worley(u * 5 + wx * 0.55, v * 3.2 + wy * 0.55, 5, 3, 353);
    const edge = w.f2 - w.f1;
    const stone = ss(0.02, 0.13, edge);
    const rock = fbm(u * 70, v * 70, 70, 70, 4, 401);
    let c = mix(A, B, cl01(w.id * 0.8 + 0.1));
    c = add(c, (rock - 0.5) * 30);
    /* сколы и вкрапления */
    const pit = ss(0.68, 0.92, fbm(u * 26, v * 26, 26, 26, 3, 433));
    c = mix(c, mix(A, B, 0.15), pit * 0.4);
    const spar = ss(0.86, 1, fbm(u * 120, v * 120, 120, 120, 2, 461));
    c = mix(c, [186, 182, 172], spar * 0.5);
    /* раствор */
    const mortar = 1 - stone;
    c = mix(c, [46, 44, 41], mortar * 0.88);
    p.r = c[0]; p.g = c[1]; p.b = c[2];
    p.h = stone * 0.72 + 0.12 + (rock - 0.5) * 0.2 - pit * 0.1;
    p.rough = 0.9 - stone * 0.06 + pit * 0.05;
  };
}

/* 3. Плиты пода/очага — крупная неровная брусчатка, светлее и теплее */
function genHearth(x, y, S, p){
  const u = x / S, v = y / S;
  const wx = (fbm(u * 8, v * 8, 8, 8, 3, 503) - 0.5) * 0.35;
  const w = worley(u * 3.4 + wx, v * 3.4 - wx, 3, 3, 541);
  const edge = ss(0.015, 0.1, w.f2 - w.f1);
  const rock = fbm(u * 60, v * 60, 60, 60, 4, 577);
  let c = mix([104, 96, 84], [172, 160, 140], cl01(w.id * 0.85 + 0.08));
  c = add(c, (rock - 0.5) * 26);
  const soot = ss(0.55, 0.9, fbm(u * 5, v * 5, 5, 5, 4, 601));
  c = mix(c, [48, 42, 38], soot * 0.45);
  c = mix(c, [62, 57, 50], (1 - edge) * 0.85);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = edge * 0.68 + 0.14 + (rock - 0.5) * 0.22;
  p.rough = 0.86 - edge * 0.08 + soot * 0.06;
}

/* 4. Огнеупорный кирпич топки — закопчённый снизу вверх */
function genFirebrick(x, y, S, p){
  const u = x / S, v = y / S, cols = 4, rows = 9;
  const row = Math.floor(v * rows);
  const cu = u * cols + (row % 2) * 0.5;
  const col = Math.floor(cu);
  const fx = cu - col, fy = v * rows - row;
  const mx = 3.4 / (S / cols), my = 3.4 / (S / rows);
  const inside = Math.min(ss(0, mx, Math.min(fx, 1 - fx)), ss(0, my, Math.min(fy, 1 - fy)));
  const rnd = hash2(col, row, 653);
  let c = mix([104, 52, 32], [166, 92, 52], rnd);
  const gr = fbm(u * 80, v * 80, 80, 80, 3, 691);
  c = add(c, (gr - 0.5) * 26);
  c = mix(c, [96, 78, 66], (1 - inside) * 0.8);
  /* сажа — гуще к верху топки */
  const soot = ss(0.1, 0.75, 1 - v) * ss(0.35, 0.8, fbm(u * 7, v * 7, 7, 7, 4, 719));
  c = mix(c, [26, 21, 19], soot * 0.85);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = inside * 0.7 + 0.15 + (gr - 0.5) * 0.2;
  p.rough = 0.9 + (gr - 0.5) * 0.08;
}

/* 5. Половая доска — широкая, тёмная, истёртая */
function genFloor(x, y, S, p){
  const u = x / S, v = y / S, planks = 4;
  const pu = u * planks, pi = Math.floor(pu), f = pu - pi;
  const rnd = hash2(pi, 0, 733);
  const gap = 3.6 / (S / planks);
  const edge = ss(0, gap, Math.min(f, 1 - f));
  const warp = fbm(u * 5, v * 1.6, 5, 2, 3, 761);
  const rings = Math.abs(Math.sin((f * 5 + warp * 3 + rnd * 5) * Math.PI * 2));
  const t = cl01(rings * 0.5 + fbm(u * 34, v * 6, 34, 6, 3, 787) * 0.5);
  let c = mix([44, 33, 24], [104, 80, 55], cl01(t * 0.8 + (rnd - 0.5) * 0.45));
  c = add(c, (fbm(u * 90, v * 9, 90, 9, 3, 809) - 0.5) * 20);
  /* вытертые дорожки */
  const worn = ss(0.55, 0.95, fbm(u * 3, v * 3, 3, 3, 3, 821));
  c = mix(c, [128, 102, 72], worn * 0.3);
  /* поперечные стыки досок */
  const seg = ss(0.985, 1, Math.abs(Math.sin(v * Math.PI * 3 + rnd * 6)));
  c = mix(c, [22, 16, 11], seg * 0.8);
  c = mix(c, [18, 13, 9], (1 - edge) * 0.92);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = edge * 0.62 + 0.18 + (t - 0.5) * 0.2 - seg * 0.4;
  p.rough = 0.84 + (1 - edge) * 0.12 - worn * 0.18;
}

/* 6. Тёсаный брус мантии — следы топора */
function genBeam(x, y, S, p){
  const u = x / S, v = y / S;
  const warp = fbm(u * 3, v * 1.2, 3, 1, 3, 853);
  const grain = Math.abs(Math.sin((v * 3.2 + warp * 2.4) * Math.PI * 2));
  const fine = fbm(u * 8, v * 30, 8, 30, 4, 877);
  let c = mix([74, 52, 32], [166, 128, 84], cl01(grain * 0.42 + fine * 0.58));
  /* затёсы топором — широкие плавные фаски вдоль бруса */
  const chop = Math.abs(Math.sin(u * Math.PI * 7 + fbm(u * 4, v * 4, 4, 4, 2, 883) * 4));
  c = add(c, (chop - 0.5) * 22);
  const crack = ss(0.965, 1, ridge(u * 3, v * 16, 3, 16, 3, 907));
  c = mix(c, [26, 18, 12], crack * 0.85);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = 0.45 + (chop - 0.5) * 0.4 + (fine - 0.5) * 0.25 - crack * 0.5;
  p.rough = 0.85 + (fine - 0.5) * 0.1;
}

/* 7. Кора поленницы */
function genBark(x, y, S, p){
  const u = x / S, v = y / S;
  const rid = ridge(u * 16, v * 2.2, 16, 2, 4, 941);
  const fine = fbm(u * 60, v * 12, 60, 12, 3, 967);
  let c = mix([32, 26, 20], [96, 84, 62], cl01(rid * 0.72 + fine * 0.38));
  const deep = ss(0.55, 0.95, rid);
  c = mix(c, [18, 14, 10], (1 - deep) * 0.45);
  const moss = ss(0.72, 0.95, fbm(u * 6, v * 6, 6, 6, 3, 983));
  c = mix(c, [72, 82, 48], moss * 0.3);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = rid * 0.8 + (fine - 0.5) * 0.25;
  p.rough = 0.93 + (fine - 0.5) * 0.06;
}

/* 8. Торец полена — годовые кольца + радиальные трещины */
function genLogEnd(x, y, S, p){
  const u = x / S - 0.5, v = y / S - 0.5;
  const r = Math.sqrt(u * u + v * v) * 2;              /* 0..1 к краю */
  const a = Math.atan2(v, u);
  const wob = (fbm(u * 6 + 3, v * 6 + 3, 12, 12, 3, 1009) - 0.5) * 0.1;
  const rings = Math.abs(Math.sin((r * 1.0 + wob) * Math.PI * 26));
  let c = mix([150, 118, 80], [196, 166, 122], cl01(rings * 0.55 + 0.25));
  /* сердцевина темнее, заболонь светлее */
  c = mix(c, [118, 88, 58], ss(0.34, 0.02, r) * 0.6);
  c = mix(c, [206, 182, 142], ss(0.72, 0.94, r) * 0.5);
  /* радиальные трещины */
  const spokes = Math.abs(Math.sin(a * 3.5 + fbm(u * 4 + 5, v * 4 + 5, 8, 8, 2, 1031) * 7));
  const crack = ss(0.985, 1, 1 - spokes) * ss(0.06, 0.5, r) * ss(0.98, 0.7, r);
  c = mix(c, [58, 40, 26], crack * 0.9);
  /* кора по кромке */
  const bark = ss(0.9, 0.99, r);
  c = mix(c, [44, 34, 24], bark);
  c = add(c, (fbm(u * 40, v * 40, 40, 40, 3, 1049) - 0.5) * 16);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = 0.55 + (rings - 0.5) * 0.22 - crack * 0.6 - bark * 0.25;
  p.rough = 0.82 + bark * 0.12;
}

/* 9. Ткань — полотенце на верёвке */
function genCloth(x, y, S, p){
  const u = x / S, v = y / S;
  const weave = (Math.sin(u * S * 0.35) * Math.sin(v * S * 0.35) + 1) * 0.5;
  const folds = fbm(u * 4, v * 1.2, 4, 1, 3, 1093);
  let c = mix([120, 116, 106], [206, 202, 190], cl01(folds * 0.8 + 0.15));
  c = add(c, (weave - 0.5) * 14);
  const dirt = ss(0.62, 0.95, fbm(u * 7, v * 7, 7, 7, 3, 1103));
  c = mix(c, [116, 104, 86], dirt * 0.35);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = folds * 0.7 + weave * 0.3;
  p.rough = 0.95;
}

/* 10. Чугун — каминные инструменты, лампа, решётка */
function genIron(x, y, S, p){
  const u = x / S, v = y / S;
  const micro = fbm(u * 130, v * 130, 130, 130, 3, 1129);
  let c = mix([22, 21, 20], [58, 55, 52], cl01(micro));
  const pit = ss(0.7, 0.95, fbm(u * 22, v * 22, 22, 22, 3, 1151));
  c = mix(c, [74, 48, 32], pit * 0.55);
  const hi = ss(0.93, 1, ridge(u * 40, v * 8, 40, 8, 3, 1163));
  c = mix(c, [122, 118, 112], hi * 0.5);
  p.r = c[0]; p.g = c[1]; p.b = c[2];
  p.h = 0.5 + (micro - 0.5) * 0.5 - pit * 0.3;
  p.rough = 0.52 + pit * 0.35 - hi * 0.2;
  p.metal = 0.92 - pit * 0.35;
}

/* 11. Ночь за окном — рисуется вектором, потом шум сверху */
function genNight(S){
  const W = S, H = S, c = cv(W, H), g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H * 0.62);
  sky.addColorStop(0, '#0c1526'); sky.addColorStop(1, '#38537c');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  /* звёзды */
  for (let i = 0; i < 90; i++){
    const sx = hash2(i, 1, 7) * W, sy = hash2(i, 2, 7) * H * 0.45;
    g.globalAlpha = 0.15 + hash2(i, 3, 7) * 0.5;
    g.fillStyle = '#cfe0f5';
    g.fillRect(sx, sy, 1.4, 1.4);
  }
  g.globalAlpha = 1;
  /* дальний склон */
  g.fillStyle = '#2b4166';
  g.beginPath(); g.moveTo(0, H * 0.66);
  for (let i = 0; i <= 20; i++){
    const t = i / 20;
    g.lineTo(t * W, H * (0.62 + Math.sin(t * 7) * 0.02 + hash2(i, 9, 3) * 0.03));
  }
  g.lineTo(W, H); g.lineTo(0, H); g.fill();
  /* ели */
  function fir(px, py, hgt, col){
    g.fillStyle = col;
    const wd = hgt * 0.38;
    for (let k = 0; k < 5; k++){
      const t = k / 5, yy = py - hgt * (t * 0.78), ww = wd * (1 - t * 0.72);
      g.beginPath();
      g.moveTo(px, yy - hgt * 0.3);
      g.lineTo(px - ww, yy + hgt * 0.03);
      g.lineTo(px + ww, yy + hgt * 0.03);
      g.closePath(); g.fill();
    }
    g.fillRect(px - hgt * 0.02, py - hgt * 0.05, hgt * 0.04, hgt * 0.09);
  }
  for (let i = 0; i < 9; i++){
    const px = (hash2(i, 21, 5) * 1.1 - 0.05) * W;
    const hgt = H * (0.3 + hash2(i, 22, 5) * 0.26);
    fir(px, H * (0.66 + hash2(i, 23, 5) * 0.05), hgt, i % 2 ? '#111d31' : '#16243a');
  }
  /* снег на земле */
  const gr = g.createLinearGradient(0, H * 0.62, 0, H);
  gr.addColorStop(0, '#6e8cb6'); gr.addColorStop(1, '#445c84');
  g.fillStyle = gr; g.fillRect(0, H * 0.68, W, H * 0.32);
  /* сухая трава из-под снега */
  g.strokeStyle = 'rgba(20,28,44,.55)'; g.lineWidth = 1.2;
  for (let i = 0; i < 60; i++){
    const bx = hash2(i, 31, 2) * W, by = H * (0.72 + hash2(i, 32, 2) * 0.26);
    g.beginPath(); g.moveTo(bx, by);
    g.quadraticCurveTo(bx + (hash2(i, 33, 2) - 0.5) * 20, by - 18, bx + (hash2(i, 34, 2) - 0.5) * 34, by - 34);
    g.stroke();
  }
  /* летящий снег */
  for (let i = 0; i < 120; i++){
    g.globalAlpha = 0.1 + hash2(i, 41, 4) * 0.35;
    g.fillStyle = '#dce9f7';
    g.beginPath(); g.arc(hash2(i, 42, 4) * W, hash2(i, 43, 4) * H, 0.8 + hash2(i, 44, 4) * 1.4, 0, 6.3);
    g.fill();
  }
  g.globalAlpha = 1;
  /* лёгкая дымка/шум */
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++){
    const n = (fbm(x / W * 8, y / H * 8, 8, 8, 3, 1201) - 0.5) * 22, o = i * 4;
    d[o] = cl(d[o] + n, 0, 255); d[o+1] = cl(d[o+1] + n, 0, 255); d[o+2] = cl(d[o+2] + n * 1.2, 0, 255);
  }
  g.putImageData(img, 0, 0);
  const t = tex(c, true);
  SETS.night = { previews: [['окно', c]] };
  return t;
}

/* 12. Картина на стене — горный пейзаж */
function genPaint(S){
  const c = cv(S, S), g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, S);
  sky.addColorStop(0, '#5a6272'); sky.addColorStop(0.6, '#9aa2ac'); sky.addColorStop(1, '#6b7280');
  g.fillStyle = sky; g.fillRect(0, 0, S, S);
  const peaks = [[0.1, 0.62], [0.28, 0.34], [0.45, 0.55], [0.62, 0.3], [0.82, 0.5], [1, 0.6]];
  g.fillStyle = '#3e4652'; g.beginPath(); g.moveTo(0, S);
  peaks.forEach(p2 => g.lineTo(p2[0] * S, p2[1] * S));
  g.lineTo(S, S); g.fill();
  g.fillStyle = '#c8cfd8';
  g.beginPath(); g.moveTo(0.28 * S, 0.34 * S); g.lineTo(0.36 * S, 0.5 * S);
  g.lineTo(0.2 * S, 0.5 * S); g.fill();
  g.beginPath(); g.moveTo(0.62 * S, 0.3 * S); g.lineTo(0.7 * S, 0.46 * S);
  g.lineTo(0.54 * S, 0.46 * S); g.fill();
  g.fillStyle = '#2b323c'; g.fillRect(0, S * 0.74, S, S * 0.26);
  const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let y = 0, i = 0; y < S; y++) for (let x = 0; x < S; x++, i++){
    const n = (fbm(x / S * 20, y / S * 20, 20, 20, 3, 1301) - 0.5) * 26, o = i * 4;
    d[o] = cl(d[o] + n, 0, 255); d[o+1] = cl(d[o+1] + n, 0, 255); d[o+2] = cl(d[o+2] + n, 0, 255);
  }
  g.putImageData(img, 0, 0);
  SETS.painting = { previews: [['холст', c]] };
  return tex(c, true);
}

/* ---- геометрия: UV в метрах ---- */
function boxUV(geo, w, h, d, s){
  const uv = geo.attributes.uv;
  const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f = 0; f < 6; f++){
    const du = dims[f][0] * s, dv = dims[f][1] * s;
    for (let k = 0; k < 4; k++){ const i = f * 4 + k; uv.setXY(i, uv.getX(i) * du, uv.getY(i) * dv); }
  }
  uv.needsUpdate = true;
}
function planeUV(geo, w, h, s){
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w * s, uv.getY(i) * h * s);
  uv.needsUpdate = true;
}
function box(w, h, d, mat, x, y, z, s, parent){
  const g = new THREE.BoxGeometry(w, h, d);
  boxUV(g, w, h, d, s === undefined ? 0.5 : s);
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
/* произвольный четырёхугольник (для скошенного дымохода) */
function quad(a, b, c, d, mat, s, parent){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2],
    a[0],a[1],a[2], c[0],c[1],c[2], d[0],d[1],d[2]]), 3));
  const L = (p, q) => Math.hypot(p[0]-q[0], p[1]-q[1], p[2]-q[2]);
  const uw = L(a, b) * s, uh = L(b, c) * s;
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([
    0,0, uw,0, uw,uh, 0,0, uw,uh, 0,uh]), 2));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
/* горизонтальные брёвна стены с проёмами под окна */
function wallLogs(mat, axis, from, to, at, rows, r, holes){
  const step = r * 1.86;
  for (let i = 0; i < rows; i++){
    const y = r + i * step;
    const segs = [[from, to]];
    (holes || []).forEach(h => {
      if (y > h.y0 - r && y < h.y1 + r){
        const out = [];
        segs.forEach(s2 => {
          if (h.b <= s2[0] || h.a >= s2[1]) out.push(s2);
          else { if (s2[0] < h.a) out.push([s2[0], h.a]); if (h.b < s2[1]) out.push([h.b, s2[1]]); }
        });
        segs.length = 0; Array.prototype.push.apply(segs, out);
      }
    });
    segs.forEach(s2 => {
      const len = s2[1] - s2[0];
      if (len < 0.05) return;
      const g = new THREE.CylinderGeometry(r, r * 0.985, len, 11, 1);
      const uv = g.attributes.uv;
      for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * 1.0, uv.getY(k) * len * 0.42);
      uv.needsUpdate = true;
      const m = new THREE.Mesh(g, mat);
      const mid = (s2[0] + s2[1]) / 2;
      if (axis === 'x'){ m.rotation.z = Math.PI / 2; m.position.set(mid, y, at); }
      else { m.rotation.x = Math.PI / 2; m.position.set(at, y, mid); }
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
    });
  }
}

/* ============================ СЦЕНА ============================ */
function buildScene(){
  MAT.log      = matOf(SETS.log,      { normalScale: 1.3 });
  MAT.rubble   = matOf(SETS.rubble,   { normalScale: 1.5 });
  MAT.hearth   = matOf(SETS.hearth,   { normalScale: 1.35 });
  MAT.brick    = matOf(SETS.brick,    { normalScale: 1.2 });
  MAT.floor    = matOf(SETS.floor,    { normalScale: 1.1 });
  MAT.beam     = matOf(SETS.beam,     { normalScale: 1.3 });
  MAT.bark     = matOf(SETS.bark,     { normalScale: 1.4, repeat: [2, 1] });
  MAT.logend   = matOf(SETS.logend,   { normalScale: 1.2 });
  MAT.cloth    = matOf(SETS.cloth,    { normalScale: 1.0 });
  MAT.iron     = matOf(SETS.iron,     { normalScale: 1.0, repeat: [2, 2] });
  MAT.woodDark = matOf(SETS.log,      { normalScale: 1.0, color: 0x8a7360 });
  MAT.charred  = matOf(SETS.bark,     { normalScale: 1.3, color: 0x5a4636 });
  MAT.night    = new THREE.MeshBasicMaterial({ map: SETS.nightTex });
  MAT.canvasArt = new THREE.MeshBasicMaterial({ map: SETS.paintTex, color: 0x2a2a30 });
  MAT.couch    = new THREE.MeshStandardMaterial({ color: 0x2c3d5c, roughness: 0.92 });
  MAT.glass    = new THREE.MeshStandardMaterial({ color: 0x1a2028, roughness: 0.1, metalness: 0.2,
                                                  transparent: true, opacity: 0.35 });
  MAT.red      = new THREE.MeshStandardMaterial({ color: 0x7a2620, roughness: 0.8 });

  const RX = 6.2, RZ0 = -4.7, RZ1 = 5.6, CEIL = 3.85;

  /* ---- пол ---- */
  const fg = new THREE.PlaneGeometry(RX * 2, RZ1 - RZ0);
  planeUV(fg, RX * 2, RZ1 - RZ0, 0.42);
  const floor = new THREE.Mesh(fg, MAT.floor);
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = (RZ0 + RZ1) / 2;
  floor.receiveShadow = true; scene.add(floor);

  /* ---- потолок с балками ---- */
  const cg = new THREE.PlaneGeometry(RX * 2, RZ1 - RZ0);
  planeUV(cg, RX * 2, RZ1 - RZ0, 0.42);
  const ceil = new THREE.Mesh(cg, MAT.floor);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, CEIL, (RZ0 + RZ1) / 2);
  ceil.receiveShadow = true; scene.add(ceil);
  for (let i = 0; i < 5; i++)
    box(RX * 2, 0.26, 0.3, MAT.beam, 0, CEIL - 0.14, RZ0 + 1.2 + i * 2.1, 0.6);

  /* ---- бревенчатые стены с проёмами ---- */
  const r = 0.17, rows = Math.ceil(CEIL / (r * 1.86));
  const winBack = { a: -4.9, b: -3.25, y0: 1.55, y1: 2.62 };
  const winRight = { a: -2.55, b: -0.85, y0: 1.5, y1: 2.6 };
  wallLogs(MAT.log, 'x', -RX, RX, RZ0, rows, r, [winBack]);
  wallLogs(MAT.log, 'x', -RX, RX, RZ1, rows, r, []);
  wallLogs(MAT.log, 'z', RZ0, RZ1, -RX, rows, r, []);
  wallLogs(MAT.log, 'z', RZ0, RZ1, RX, rows, r, [winRight]);
  /* тёмная «конопатка» позади брёвен */
  const chink = new THREE.MeshStandardMaterial({ color: 0x14100c, roughness: 1 });
  box(RX * 2 + 0.5, CEIL + 0.4, 0.1, chink, 0, CEIL / 2, RZ0 - 0.14, 0.4);
  box(0.1, CEIL + 0.4, RZ1 - RZ0 + 0.5, chink, -RX - 0.14, CEIL / 2, (RZ0 + RZ1) / 2, 0.4);
  box(0.1, CEIL + 0.4, RZ1 - RZ0 + 0.5, chink, RX + 0.14, CEIL / 2, (RZ0 + RZ1) / 2, 0.4);
  box(RX * 2 + 0.5, CEIL + 0.4, 0.1, chink, 0, CEIL / 2, RZ1 + 0.14, 0.4);

  /* ---- окна ---- */
  function windowUnit(cx, cy, cz, w, h, ry, lightPos){
    const g = new THREE.Group(); g.position.set(cx, cy, cz); g.rotation.y = ry;
    const pg = new THREE.PlaneGeometry(w, h);
    const night = new THREE.Mesh(pg, MAT.night);
    night.position.z = -0.16; g.add(night);
    const f = 0.13;
    box(w + f * 2, f, 0.2, MAT.woodDark, 0, h / 2 + f / 2, 0, 2, g);
    box(w + f * 2, f, 0.2, MAT.woodDark, 0, -h / 2 - f / 2, 0, 2, g);
    box(f, h + f * 2, 0.2, MAT.woodDark, -w / 2 - f / 2, 0, 0, 2, g);
    box(f, h + f * 2, 0.2, MAT.woodDark, w / 2 + f / 2, 0, 0, 2, g);
    box(0.05, h, 0.09, MAT.woodDark, 0, 0, -0.05, 4, g);
    box(w, 0.05, 0.09, MAT.woodDark, 0, 0, -0.05, 4, g);
    box(w + 0.34, 0.09, 0.3, MAT.woodDark, 0, -h / 2 - 0.16, 0.07, 2, g);
    scene.add(g);
    const L = new THREE.PointLight(0x4d78bd, 0.38, 7.5, 2);
    L.position.set(lightPos[0], lightPos[1], lightPos[2]); scene.add(L);
  }
  windowUnit((winBack.a + winBack.b) / 2, (winBack.y0 + winBack.y1) / 2, RZ0 + 0.16,
             winBack.b - winBack.a, winBack.y1 - winBack.y0, 0, [-4.1, 2.1, -3.9]);
  windowUnit(RX - 0.16, (winRight.y0 + winRight.y1) / 2, (winRight.a + winRight.b) / 2,
             winRight.b - winRight.a, winRight.y1 - winRight.y0, -Math.PI / 2, [5.4, 2.1, -1.7]);

  /* ======================= КАМИН ======================= */
  const FX = 0.55;                 /* ось камина по X */
  const FZB = RZ0 + 0.05;          /* задняя плоскость */
  const FZF = FZB + 1.3;           /* фасад */
  const HT = 0.34;                 /* верх подиума очага */
  const OP_W = 1.62, OP_TOP = 1.72;/* проём топки */
  const BODY_TOP = 2.28;
  const PIER = (3.34 - OP_W) / 2;

  /* подиум очага */
  box(4.3, HT, 1.75, MAT.hearth, FX, HT / 2, FZF - 0.02 + 0.86, 0.75);
  box(4.5, 0.06, 1.9, MAT.hearth, FX, HT, FZF - 0.02 + 0.9, 0.75);

  /* боковые устои и перемычка */
  box(PIER, BODY_TOP - HT, 1.3, MAT.rubble, FX - OP_W / 2 - PIER / 2, HT + (BODY_TOP - HT) / 2, FZB + 0.65, 0.62);
  box(PIER, BODY_TOP - HT, 1.3, MAT.rubble, FX + OP_W / 2 + PIER / 2, HT + (BODY_TOP - HT) / 2, FZB + 0.65, 0.62);
  box(OP_W, BODY_TOP - OP_TOP, 1.3, MAT.rubble, FX, OP_TOP + (BODY_TOP - OP_TOP) / 2, FZB + 0.65, 0.62);

  /* топка: под, задняя стенка, щёки */
  box(OP_W, 0.06, 1.15, MAT.brick, FX, HT + 0.03, FZB + 0.6, 1.1);
  box(OP_W, OP_TOP - HT, 0.12, MAT.brick, FX, HT + (OP_TOP - HT) / 2, FZB + 0.1, 1.1);
  box(0.1, OP_TOP - HT, 1.15, MAT.brick, FX - OP_W / 2 + 0.05, HT + (OP_TOP - HT) / 2, FZB + 0.6, 1.1);
  box(0.1, OP_TOP - HT, 1.15, MAT.brick, FX + OP_W / 2 - 0.05, HT + (OP_TOP - HT) / 2, FZB + 0.6, 1.1);
  box(OP_W, 0.1, 1.15, MAT.brick, FX, OP_TOP - 0.05, FZB + 0.6, 1.1);

  /* брус-мантия */
  box(3.9, 0.32, 0.66, MAT.beam, FX, BODY_TOP + 0.16, FZF - 0.12, 0.62);

  /* дымоход-колпак: сходящаяся трапеция, задняя грань прижата к стене */
  (function hood(){
    const y0 = BODY_TOP + 0.32, y1 = CEIL;
    const w0 = 1.67, w1 = 0.86;
    const z0 = FZF - 0.16, z1 = FZB + 0.5, zb = FZB;
    const P = (dx, y, z) => [FX + dx, y, z];
    const bfl = P(-w0, y0, z0), bfr = P(w0, y0, z0), tfr = P(w1, y1, z1), tfl = P(-w1, y1, z1);
    const bbl = P(-w0, y0, zb), bbr = P(w0, y0, zb), tbr = P(w1, y1, zb), tbl = P(-w1, y1, zb);
    quad(bfl, bfr, tfr, tfl, MAT.rubble, 0.62);            /* фасад */
    quad(bbl, bfl, tfl, tbl, MAT.rubble, 0.62);            /* левый скос */
    quad(bfr, bbr, tbr, tfr, MAT.rubble, 0.62);            /* правый скос */
  })();

  /* ---- решётка, дрова, угли ---- */

/* ---- обновление пламени ---- */
function updateFire(t, dt){
  const W = fire.W, H = fire.H, d = fire.img.data;
  let i = 0;
  for (let y = 0; y < H; y++){
    const v = 1 - y / H;                       /* 0 внизу, 1 вверху */
    const taper = Math.pow(1 - v, 0.62);
    const sway = Math.sin(t * 2.1 + v * 3.6) * 0.1 * v + Math.sin(t * 3.7 + v * 6) * 0.045 * v;
    for (let x = 0; x < W; x++, i++){
      const u = x / W - 0.5;
      const turb = fbm(x / W * 3.2, y / H * 3.4 + t * 1.35, 8, 64, 4, 1451) - 0.5;
      const dist = Math.abs(u - sway) / (taper * 0.60 + 0.02);
      let val = 1 - dist + turb * (0.45 + v * 1.05) - v * 0.42;
      const a = ss(0.26, 0.58, val) * (1 - ss(0.56, 0.95, v));
      const core = ss(0.55, 0.92, val) * (1 - ss(0.2, 0.72, v));
      let c = mix([186, 30, 4], [255, 146, 26], ss(0.3, 0.7, val));
      c = mix(c, [255, 240, 196], core * 0.95);
      const o = i * 4;
      d[o] = c[0]; d[o+1] = c[1]; d[o+2] = c[2];
      d[o+3] = cl(a * 255, 0, 255);
    }
  }
  fire.ctx.putImageData(fire.img, 0, 0);
  fire.tex.needsUpdate = true;

  /* мерцание */
  const fl = 0.72 + fbm(t * 1.6, 0.5, 64, 64, 3, 99) * 0.5 + Math.sin(t * 17.3) * 0.045;
  fire.light.intensity = 3.4 * fl * fireGain;
  fire.light2.intensity = 1.1 * fl * fireGain;
  fire.glow.material.opacity = 0.55 + fl * 0.35;
  fire.glow.scale.set(2.5 + fl * 0.4, 2.1 + fl * 0.35, 1);
  fire.coalMat.emissiveIntensity = 1.2 + fl * 0.9;
  fire.planes.forEach((p, k) => {
    p.scale.set(0.86 + fl * 0.22 + k * 0.03, 0.8 + fl * 0.34, 1);
    p.material.opacity = 1;
  });

  /* искры */
  const pos = embers.geometry.attributes.position;
  for (let k = 0; k < fire.eData.length; k++){
    const e = fire.eData[k];
    e.life -= dt * (0.28 + hash2(k, 1, 3) * 0.35);
    if (e.life <= 0){
      e.life = 1;
      e.x = fire.pos.x + (Math.random() - 0.5) * 0.5;
      e.y = fire.pos.y - 0.2;
      e.z = fire.pos.z + (Math.random() - 0.5) * 0.35;
      e.vy = 0.5 + Math.random() * 0.9;
      e.vx = (Math.random() - 0.5) * 0.25;
      e.vz = (Math.random() - 0.5) * 0.15;
    }
    e.vx += Math.sin(t * 3 + k) * 0.12 * dt;
    e.x += e.vx * dt; e.y += e.vy * dt; e.z += e.vz * dt;
    pos.setXYZ(k, e.x, e.y, e.z);
  }
  pos.needsUpdate = true;
}

const keyMap = {};
let yaw = -0.16, pitch = -0.10, fly = false, fireGain = 1;
addEventListener('keydown', e => {
  keyMap[e.code] = true;
  const k = e.key.toLowerCase();
  if (k === 'm' || k === 'ь') document.getElementById('mats').classList.toggle('on');
  if (k === 'f' || k === 'а') fly = !fly;
  if (k === 'h' || k === 'р'){ const u = document.getElementById('ui');
    u.style.display = u.style.display === 'none' ? '' : 'none'; }
  if (k === '1') fireGain = Math.max(0.25, fireGain - 0.2);
  if (k === '2') fireGain = Math.min(2.2, fireGain + 0.2);
  if (e.code === 'BracketLeft')  renderer.toneMappingExposure = Math.max(0.4, renderer.toneMappingExposure - 0.1);
  if (e.code === 'BracketRight') renderer.toneMappingExposure = Math.min(3.0, renderer.toneMappingExposure + 0.1);
});
addEventListener('keyup', e => keyMap[e.code] = false);
canvas.addEventListener('click', () => { if (!('ontouchstart' in window)) canvas.requestPointerLock(); });
function look(dx, dy){ yaw -= dx * 0.0022; pitch = cl(pitch - dy * 0.0022, -1.35, 1.35); }
addEventListener('mousemove', e => { if (document.pointerLockElement === canvas) look(e.movementX, e.movementY); });
let drag = false, lx = 0, ly = 0;
canvas.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('mouseup', () => drag = false);
addEventListener('mousemove', e => {
  if (drag && document.pointerLockElement !== canvas){
    look(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; }
});
const stick = document.getElementById('stick');
let joyId = null, joyO = [0,0], joyV = [0,0], lookId = null, lookP = [0,0];
canvas.addEventListener('touchstart', e => {
  for (const t of e.changedTouches){
    if (t.clientX < innerWidth * 0.45 && joyId === null){
      joyId = t.identifier; joyO = [t.clientX, t.clientY];
      stick.style.display = 'block';
      stick.style.left = (t.clientX - 48) + 'px'; stick.style.top = (t.clientY - 48) + 'px';
    } else if (lookId === null){ lookId = t.identifier; lookP = [t.clientX, t.clientY]; }
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (t.identifier === joyId){
      const dx = cl(t.clientX - joyO[0], -48, 48), dy = cl(t.clientY - joyO[1], -48, 48);
      joyV = [dx / 48, dy / 48];
      stick.firstElementChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    } else if (t.identifier === lookId){
      look((t.clientX - lookP[0]) * 1.6, (t.clientY - lookP[1]) * 1.6);
      lookP = [t.clientX, t.clientY];
    }
  }
  e.preventDefault();
}, { passive: false });
const endT = e => { for (const t of e.changedTouches){
  if (t.identifier === joyId){ joyId = null; joyV = [0,0]; stick.style.display = 'none';
    stick.firstElementChild.style.transform = ''; }
  if (t.identifier === lookId) lookId = null; } };
canvas.addEventListener('touchend', endT);
canvas.addEventListener('touchcancel', endT);

/* ========================= ЦИКЛ ========================= */
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const vel = new THREE.Vector3();
let prev = performance.now(), frames = 0;
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min((now - prev) / 1000, 0.05); prev = now;
  const t = now / 1000;

  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  let fwd = 0, side = 0;
  if (keyMap.KeyW || keyMap.ArrowUp) fwd += 1;
  if (keyMap.KeyS || keyMap.ArrowDown) fwd -= 1;
  if (keyMap.KeyA || keyMap.ArrowLeft) side -= 1;
  if (keyMap.KeyD || keyMap.ArrowRight) side += 1;
  fwd -= joyV[1]; side += joyV[0];
  const speed = keyMap.ShiftLeft ? 4.2 : 1.9;          /* м/с */
  const dir = new THREE.Vector3(side, 0, -fwd);
  if (dir.lengthSq() > 0) dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  dir.multiplyScalar(speed);
  vel.lerp(dir, 1 - Math.pow(0.0015, dt));
  camera.position.addScaledVector(vel, dt);
  if (fly){
    if (keyMap.Space) camera.position.y += 2.4 * dt;
    if (keyMap.ControlLeft || keyMap.KeyC) camera.position.y -= 2.4 * dt;
  } else camera.position.y += (1.72 - camera.position.y) * 0.22;
  camera.position.x = cl(camera.position.x, -5.6, 5.6);
  camera.position.z = cl(camera.position.z, -1.6, 5.0);

  updateFire(t, dt);

  /* тени статичны — считаем их только на старте, дальше только мерцание */
  frames++;
  if (frames === 3) fire.light.shadow.autoUpdate = false;

  renderer.render(scene, camera);
}

/* ========================= ЗАПУСК ========================= */
const bar = document.getElementById('bar'), st = document.getElementById('st');
const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const jobs = [
  ['брёвна сруба',      () => makeSet('log', 512, genLog, 2.6)],
  ['бутовый камень',    () => makeSet('rubble', 512, genRubble(false), 3.0)],
  ['плиты очага',       () => makeSet('hearth', 512, genHearth, 2.6)],
  ['кирпич топки',      () => makeSet('brick', 512, genFirebrick, 2.2)],
  ['половая доска',     () => makeSet('floor', 512, genFloor, 2.2)],
  ['тёсаный брус',      () => makeSet('beam', 512, genBeam, 2.4)],
  ['кора дров',         () => makeSet('bark', 256, genBark, 3.2)],
  ['торцы поленьев',    () => makeSet('logend', 256, genLogEnd, 2.0)],
  ['ткань',             () => makeSet('cloth', 256, genCloth, 1.6)],
  ['чугун',             () => makeSet('iron', 256, genIron, 1.8)],
  ['ночь за окном',     () => { SETS.nightTex = genNight(512); }],
  ['картина',           () => { SETS.paintTex = genPaint(256); }]
];

async function boot(){
  resize();
  for (let i = 0; i < jobs.length; i++){
    st.textContent = jobs[i][0];
    bar.style.width = (i / (jobs.length + 1) * 100) + '%';
    await frame();
    jobs[i][1]();
  }
  st.textContent = 'ставим сруб'; bar.style.width = '94%'; await frame();
  buildScene();
  buildPanel();
  bar.style.width = '100%'; await frame();
  document.getElementById('load').classList.add('done');
  requestAnimationFrame(tick);
}
function buildPanel(){
  const list = document.getElementById('matlist');
  const T = { log: 'Брёвна сруба', rubble: 'Бутовый камень', hearth: 'Плиты очага',
    brick: 'Кирпич топки', floor: 'Половая доска', beam: 'Тёсаный брус', bark: 'Кора дров',
    logend: 'Торец полена', cloth: 'Ткань', iron: 'Чугун', night: 'Ночь за окном', painting: 'Картина' };
  for (const k in SETS){
    const s = SETS[k];
    if (!s || !s.previews) continue;
    const d = document.createElement('div'); d.className = 'm';
    d.innerHTML = '<div class="n">' + (T[k] || k) + '</div>';
    const row = document.createElement('div'); row.className = 'r';
    s.previews.forEach(pr => {
      const wrap = document.createElement('div');
      const c = cv(68, 68); c.getContext('2d').drawImage(pr[1], 0, 0, 68, 68);
      wrap.appendChild(c);
      const l = document.createElement('div'); l.className = 'lbl'; l.textContent = pr[0];
      wrap.appendChild(l); row.appendChild(wrap);
    });
    d.appendChild(row); list.appendChild(d);
  }
}
boot();
</script>
